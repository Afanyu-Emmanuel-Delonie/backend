spring.application.name=dairyfarm-api
server.port=8080

# PostgreSQL is the default persistence layer. Set DB_URL, DB_USERNAME, and
# DB_PASSWORD in the environment, or use the included docker-compose.yml.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dairy_farm_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
