spring.application.name=dairyfarm-api
server.port=8080

# Loads .env.local (gitignored) for local dev secrets, then falls back to
# .env for CI/production injection. Both are optional.
spring.config.import=optional:file:.env.local[.properties],optional:file:.env[.properties]

# PostgreSQL is the default persistence layer. Set DB_URL, DB_USERNAME, and
# DB_PASSWORD in the environment, or use the included docker-compose.yml.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dairy_farm_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
# Required: a long random secret (32+ chars), e.g. `openssl rand -base64 32`.
# No default on purpose — the app fails fast if it's missing instead of
# silently signing tokens with a guessable key.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- Email (SMTP) ---
# For Gmail: use a 16-character App Password (myaccount.google.com/apppasswords),
# not the account's normal login password. Requires 2-Step Verification enabled.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

# --- One-time codes ---
app.otp.expiration-minutes=${OTP_EXPIRATION_MINUTES:10}
app.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:30}
app.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:15}

# --- CORS ---
# Comma-separated list of allowed frontend origins (no trailing slashes).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# --- RabbitMQ (async email delivery) ---
# Defaults match the included docker-compose.yml / a local `rabbitmq:3-management` container.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
app.rabbitmq.email-exchange=farmiq.email.exchange
app.rabbitmq.email-queue=farmiq.email.otp
app.rabbitmq.email-routing-key=email.otp
app.rabbitmq.invite-email-queue=farmiq.email.invite
app.rabbitmq.invite-email-routing-key=email.invite

# --- OAuth2 (Google sign-in) ---
# Create credentials at https://console.cloud.google.com/apis/credentials (OAuth client ID,
# type "Web application"). Authorized redirect URI: http://localhost:8080/login/oauth2/code/google
# Left blank, the "Continue with Google" button is present but inert (no crash on startup) —
# see security.OAuth2ClientConfig.
app.oauth2.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
