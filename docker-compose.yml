services:
  postgres:
    image: postgres:16-alpine
    container_name: dairyfarm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dairy_farm_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - dairyfarm-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dairy_farm_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: dairyfarm-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env.local
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/dairy_farm_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: dairyfarm-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_BACKEND_URL: http://backend:8080
    ports:
      - "3000:3000"

volumes:
  dairyfarm-postgres-data:
