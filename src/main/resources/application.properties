spring.application.name=dairyfarm-api
server.port=8080

# Default profile: file-based H2 so the API runs immediately with no external
# database install. Switch to the postgres profile (matching the original
# DairyFarmManagementSystem JSF project) with --spring.profiles.active=postgres
spring.datasource.url=jdbc:h2:file:./data/dairyfarmdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
