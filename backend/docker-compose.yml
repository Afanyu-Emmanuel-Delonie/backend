services:
  postgres:
    image: postgres:16-alpine
    container_name: dairyfarm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dairy_farm_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - dairyfarm-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dairy_farm_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dairyfarm-postgres-data:
